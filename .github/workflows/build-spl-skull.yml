name: Build SPL skull asset
on:
  workflow_dispatch:
  push:
    paths: ["scripts/build_spl_skull.py"]
permissions: {contents: write}
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy trimesh vtk fast-simplification
      - run: python scripts/build_spl_skull.py
      - name: Commit derived atlas asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/spl-skull.glb public/assets/spl-skull.json
          git diff --cached --quiet || git commit -m "data: add CT-derived SPL skull mesh"
          git pull --rebase origin main
git push
