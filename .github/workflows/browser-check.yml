name: Browser navigation check
on:
  push:
    branches: [main, 'fix/visible-navigation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: pip install playwright numpy pillow
      - run: python -m playwright install --with-deps chromium
      - name: Verify actual rendered navigation
        run: |
          python -m http.server 4173 --directory dist >/tmp/tss-http.log 2>&1 &
          sleep 2
          python browser-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results
          retention-days: 7
